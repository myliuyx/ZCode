name: Release Desktop

# 手动触发的桌面安装包构建：macOS / Windows / Linux 三平台并行出包。
#
# 产物先传为 Actions artifact；publish_release 默认开启，会额外创建
# 一个 draft Release（三平台全绿后才创建）。
#
# 关于 electron-builder.config.js 里的 publish.url：
# 它只是打包时给 electron-builder 的 generic provider 占位（http://localhost:8081），
# 运行时并不会读取——autoUpdater.ts 的 resolveUpdateFeedSourceFromStartupConfig
# 在 app.isPackaged 时直接忽略本地覆盖，正式包的更新源由服务端下发的 manifest 决定。
# 因此往 GitHub Releases 发布安装包不会把自动更新指向这个占位地址。

on:
  # 只保留手动触发：产物是完整安装包，自动 push 触发没有对应场景，
  # 也会把 fork 里的 Actions 额度消耗在无意义的重复构建上。
  workflow_dispatch:
    inputs:
      publish_release:
        description: "创建 GitHub Release（draft，需手动发布）"
        required: false
        type: boolean
        default: true

concurrency:
  # 同一分支不允许并发构建：产物共用 packages/desktop/dist，矩阵并行会互相覆盖。
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target_os: mac
            target_arch: arm64
            artifact: zcode-darwin-arm64
          - name: Windows x64
            os: windows-2022
            target_os: win
            target_arch: x64
            artifact: zcode-win32-x64
          - name: Linux x64
            # 钉住 22.04 而不是 ubuntu-latest（24.04）：
            # 24.04 的 AppImage 需要手动装 libfuse2，且各版本 glibc 差异会让产物兼容性变差。
            os: ubuntu-22.04
            target_os: linux
            target_arch: x64
            artifact: zcode-linux-x64

    env:
      # 与 mise.toml 保持一致；workflow 里的版本升级必须同时更新 mise.toml。
      NODE_VERSION: "24.14.0"
      PNPM_VERSION: "10.33.2"
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      # Electron runtime 下载走国内镜像。bundle.mjs 会把它收敛成 electron-builder
      # 专用配置，避免 @electron/get 的全局变量污染 dmg-builder 等辅助包。
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      # 桌面安装包不引用 packages/desktop/mock-cdn，跳过远程资源准备可省约 20 分钟，
      # 同时避免脚本回退去读内网依赖源地址。
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 不开 lfs：本仓库的 third-party/native-search 归档以普通 git blob 存储
          # （.gitattributes 没有 filter=lfs），开 lfs 只会多一次无用的 git lfs 调用。
          # third-party 原文的字节保真由 .gitattributes 的 -text 保证，与 LFS 无关。
          ref: ${{ github.sha }}

      - name: Resolve Node version
        id: node
        shell: bash
        run: echo "version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: |
            apps/zcode-cli/node_modules/.cache/turbo
            packages/desktop/node_modules/.cache/turbo
            node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ matrix.target_arch }}-${{ hashFiles('turbo.json', 'apps/zcode-cli/turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.target_arch }}-

      # Linux 需要补齐 AppImage 运行库和 deb 打包工具。
      # electron-builder 的 rpm 目标需要 rpmbuild，pacman 需要对应工具，
      # Ubuntu runner 都没有，因此下面通过 ZCODE_DESKTOP_LINUX_TARGETS 收窄 target。
      # node-pty 自带 darwin/win32 预编译产物（安装时跳过 electron-rebuild），
      # Linux 侧由 @lydell/node-pty-linux-x64 提供，并已列入 pnpm-workspace allowBuilds，
      # 因此无需额外的编译工具链。
      - name: Install Linux packaging dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            libssl-dev \
            dpkg \
            fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        shell: bash
        env:
          # 仅 ZCODE_PREVIEW_IDENTITY=1 时用 Preview 身份；
          # 留空时 resolveDesktopProductFlavor 会把 test 环境归为 Preview。
          ZCODE_PREVIEW_IDENTITY: ${{ vars.ZCODE_PREVIEW_IDENTITY }}
          ZCODE_DESKTOP_LINUX_TARGETS: ${{ matrix.target_os == 'linux' && 'AppImage,deb' || '' }}
        run: |
          pnpm bundle:desktop -- --os "${{ matrix.target_os }}" --arch "${{ matrix.target_arch }}"

      # electron-builder 把产物和 unpacked 目录一起放在 dist 下。
      # 只上传真正的安装包，排除 intermediate/ 里的中间产物。
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb

  # 三个平台全部成功后才创建 Release；任一平台失败则不会产生半成品 Release。
  publish-release:
    name: Publish GitHub Release
    needs: bundle
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tag 跟随根 package.json 版本，不在 workflow 里硬编码版本号。
      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List collected files
        run: |
          find installers -type f -printf '%f\t%s\n' | sort
          count=$(find installers -type f | wc -l)
          if [ "$count" -lt 4 ]; then
            echo "expected at least 4 installers (dmg+zip+exe+AppImage+deb), got $count" >&2
            exit 1
          fi

      # 说明正文放在仓库里维护，避免把 markdown 嵌在 YAML 里难以校对；
      # 占位符在构建时用真实版本/commit 替换。
      - name: Render release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sed -e "s|\$VERSION|$VERSION|g" \
              -e "s|\$COMMIT_SHA|$COMMIT_SHA|g" \
              -e "s|\$RUN_ID|$RUN_ID|g" \
              .github/release-notes.md > installers/README.md
          head -5 installers/README.md

      # 先建 draft：构建产物需要人工确认后再发布，避免半成品挂到 Releases 页。
      # tag 已存在时不报错，沿用既有 tag 更新 Release（支持版本号不变时重跑）。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(installers/*.dmg installers/*.zip installers/*.exe installers/*.AppImage installers/*.deb)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no installer assets found under installers/" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release for $TAG already exists, updating it"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file installers/README.md
          else
            gh release create "$TAG" \
              --title "ZCode $TAG" \
              --notes-file installers/README.md \
              --draft \
              "${assets[@]}"
          fi

      - name: Publish release
        if: ${{ vars.ZCODE_DRAFT_RELEASE == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release edit "$TAG" --draft=false

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "### Release \`$TAG\`"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in installers/*.dmg installers/*.zip installers/*.exe installers/*.AppImage installers/*.deb; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s MiB |\n' "$(basename "$f")" "$(( $(stat -c%s "$f") / 1024 / 1024 ))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
